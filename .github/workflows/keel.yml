# keel (generated -- do not edit; keel update rewrites this file)
#
# The first step installs the tool; the rest judge with it.
# There is no released binary yet, so that step builds it from source:
# it needs git and cargo on the runner, and it costs minutes on a
# cold cache. If your project already puts `keel` on PATH some other
# way, replace this step with yours -- the courts below do not care
# how it got there. To keep an edited copy for good, delete this
# file's line from [generated] in keel.toml as well: otherwise
# `keel update` will keep saying it did not overwrite you.
name: keel

on:
  push:
  pull_request:

jobs:
  keel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: the tool itself
        # Clones the method into ~/.keel, then builds it from source.
        # It needs git and cargo on the runner, and cargo writes
        # its own registry into CARGO_HOME while it does.
        # keel.toml pins this version, so the step fetches it.
        env:
          KEEL_REF: "0.1.0"
        run: |
          curl -fsSL https://raw.githubusercontent.com/Codcore/keel/main/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: the documents judged
        # On a pull_request event actions/checkout leaves a
        # detached HEAD and git serves no branch, so the scope
        # court would be skipped in silence. Sec. 4.10 asks for
        # the branch to be named where git hides it; this names
        # it. Where git does know the branch, git is believed.
        env:
          KEEL_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: keel check .
      - name: the closure court
        run: keel close .
      - name: the toolchain this project pins
        # rust-toolchain.toml names 1.94.1; rustup honours it on
        # its own, and this line says aloud WHICH one judged, so a
        # verdict here is the same verdict on any other machine.
        run: rustup toolchain install 1.94.1 --profile minimal
      - name: the battery
        run: cargo test --no-fail-fast
        working-directory: tool
