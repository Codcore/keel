# Конфіг проєкту keel — словник полів: docs/uk/NEW-CONCEPT.md, «Конфіг».
# Мова прози цього проєкту — українська; код і commit-и — англійською
# (мовна політика, V2-PROCESS «Мова»).
lang = "uk"
# Адаптер тестів: крейт інструмента живе в tool/ — рівно одна тека
# першого рівня з Cargo.toml, тож адаптер знаходить його сам.
adapter = "cargo"
agents = ["claude", "cursor"]
# Пін інструмента (щабель 16, хвиля 0018): точна версія бінарника;
# зміна піна — рядок diff-а, затверджений merge-ом (NEW-CONCEPT,
# «Дистрибуція»).
version = "0.1.0"
# Власний gate проєкту (щабель 17, хвиля 0019): close жене його крізь
# довіру §7.16 — fmt над крейтом інструмента.
ci = "cargo fmt --manifest-path tool/Cargo.toml --check"

