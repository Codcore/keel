# Конфіг проєкту keel — словник полів: docs/uk/NEW-CONCEPT.md, «Конфіг».
# Мова прози цього проєкту — українська; код і commit-и — англійською
# (мовна політика, V2-PROCESS «Мова»).
lang = "uk"
# Адаптер тестів: крейт інструмента живе в tool/ — рівно одна тека
# першого рівня з Cargo.toml, тож адаптер знаходить його сам.
adapter = "cargo"
agents = ["claude", "cursor"]
# Пін інструмента (щабель 16, хвиля 0018): точна версія бінарника;
# зміна піна — рядок diff-а, затверджений merge-ом (NEW-CONCEPT,
# «Дистрибуція»).
version = "1.3.0"
# Власний gate проєкту (щабель 17, хвиля 0019): close жене його крізь
# довіру §7.16. Однією складеною командою — те саме, що жене CI
# (хвиля 0068): fmt і clippy. Доти `ci` називав саму fmt, і clippy
# ловився лише на PR — рецензент релізу 1.2.0 виніс пʼять зауважень,
# яких місцевий суд не бачив.
ci = "cargo fmt --manifest-path tool/Cargo.toml --check && cargo clippy --manifest-path tool/Cargo.toml --all-targets --all-features -- -D warnings"

[trust]
"cargo test --manifest-path tool/Cargo.toml --test frame_flags_test" = "0530ad5ea5c5"
"cargo test --manifest-path tool/Cargo.toml --test launcher_test --test versions_test" = "d3dadca33fa6"
"cargo test --manifest-path tool/Cargo.toml --test release_test --test launcher_fetch_test" = "9806d99959b0"
"cargo fmt --manifest-path tool/Cargo.toml --check && cargo clippy --manifest-path tool/Cargo.toml --all-targets --all-features -- -D warnings" = "4eb825fb93fa"

