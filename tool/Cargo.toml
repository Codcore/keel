[package]
name = "keel"
version = "0.1.0"
edition = "2024"

[dependencies]
fluent-bundle = "0.16.0"
saphyr-parser = "0.0.12"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
toml = "1.1.4"
unic-langid = "0.9.6"

inquire = "0.9.4"

[dev-dependencies]
# The scenario reads the config the wizard wrote with a real TOML
# parser, not by matching strings (the school of 0023 R-1).
toml = "1.1.4"
# The foreign judge of the hook configs: their shape is judged by a
# real JSON parser, never by string matching (wave 0025).
serde_json = "1.0"
# The foreign judge of shape: the front matter of every generated
# skill is parsed by a real YAML parser in the scenario tests, never
# by string matching (review 0023 R-1).
saphyr-parser = "0.0.12"
